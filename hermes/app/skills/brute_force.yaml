skill: brute_force
category: credential_attack
description: Detects repeated authentication failures, Wazuh brute-force wording, and M365 AzureAD role changes.
match:
  event_types: [credential_attack]
  type_only: true
  mitre_techniques: [T1110]
  keywords: ["failed password", "authentication failur", "invalid user", "login attempt failed", "vpn",
    "brute force", "multiple authentication failures", "failed login", "after multiple failures",
    "correlated credential failures", "password spray", "credential stuffing"]
mitre_technique: ["T1110", "T1098"]
investigation_steps:
  - "Correlate all failed login events for the same source IP within a 15 minute window"
  - "Check whether a successful login followed the failed attempts"
severity_hint: high
